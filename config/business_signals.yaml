- id: diagnosis
  label: 商业模式诊断
  skill: dbs-diagnosis
  keywords:
  - 赚钱
  - 商业模式
  - 怎么变现
  - 收入
  - 利润
  - 定价
  - 卖什么
  - 卖给谁
  - 怎么获客
  - 怎么交付
  - 产品是什么
  - 付款链接
  - 引流款
  - 利润款
  - 不赚钱
  - 变现
  patterns:
  - 怎么(赚钱|变现|盈利)
  - (卖|定价|收费)\w{0,3}(多少|怎么|贵|便宜)
  - 这个(生意|业务|模式)
- id: benchmark
  label: 对标分析
  skill: dbs-benchmark
  keywords:
  - 学谁
  - 对标
  - 模仿
  - 抄
  - 参考
  - 借鉴
  - 像.*一样
  - 朝钱
  - 老王
  - 云瀚
  - 李笑来
  - CZ
  - 锐子
  - 模仿颗粒度
  - 像素级
  patterns:
  - (学|模仿|抄|对标)\w{0,2}(谁|一下|他)
  - (像|跟)\S{1,4}(一样|学|做)
  - (凭什么|为啥|为什么)\S{1,6}(能|可以)(赚钱|成功)
- id: content
  label: 内容创作诊断
  skill: dbs-content
  keywords:
  - 小红书
  - 抖音
  - 视频
  - 标题
  - 封面
  - 开头
  - 文案
  - 自媒体
  - 内容怎么做
  - 公开日记
  - 写作
  - 公众号
  - 起号
  - 播放量
  - 完播率
  - 流量
  patterns:
  - (小红书|抖音|视频号|公众号)(怎么|如何|起号|运营)
  - (拍|发|做|写)\w{0,2}(视频|内容|文案|文章)
  - 播放量|完播率|涨粉|流量
- id: action
  label: 执行力诊断
  skill: dbs-action
  keywords:
  - 拖延
  - 做不动
  - 不想做
  - 知道该做但
  - 懒
  - 逃避
  - 害怕
  - 不敢
  - 再想想
  - 等准备好了
  - 就是不做
  - 一直在准备
  - 还没开始
  patterns:
  - 知道\S{1,4}(但|就是)\S{1,4}(不做|没做|做不)
  - (总是|一直)\S{0,3}(拖延|逃避|害怕)
  - 等\S{1,4}(好了|完了|准备好)
- id: goal
  label: 目标清晰化
  skill: dbs-goal
  keywords:
  - 我想做
  - 我想成为
  - 我想变
  - 我的目标是
  - 我想有
  - 未来我想
  - 个人 IP
  - 影响力
  - 财务自由
  - 变得更强
  - 想做有影响力
  patterns:
  - 我想(做|成为|变|有)\S{1,10}
  - 我的目标是
  - 我要(做|成为|变)
- id: decision
  label: 决策分析
  skill: dbs-decision
  keywords:
  - 选 A 还是
  - 留学还是
  - 考研还是
  - 打工还是
  - 出国还是
  - 纠结
  - 不知道选哪个
  - 二选一
  - 要不要
  - 该不该
  patterns:
  - (还是|要么|或者)\S{1,6}(算了|吧|不)
  - (要不要|该不该)\S{1,10}
  - 纠结\S{0,4}(要不要|该|选)
- id: deconstruct
  label: 概念拆解
  skill: dbs-deconstruct
  keywords:
  - 什么意思
  - 什么叫
  - 搞不清楚
  - 不懂什么是
  - 这个词
  - 这个概念
  patterns:
  - (什么|啥)(意思|叫|是)
  - 搞不(清楚|懂|明白)
- id: slowisfast
  label: 慢就是快
  skill: dbs-slowisfast
  keywords:
  - 太快了
  - 有没有更慢
  - 捷径
  - 贪快
  - 想绕开
  - 省事的方法
  - 快速
  - 速成
  patterns:
  - (太快|太急|急着|赶着)
  - (捷径|速成|快速)\S{0,3}(方法|方式|路径)
- id: good_question
  label: 好问题生成
  skill: dbs-good-question
  keywords:
  - 问题到底是什么
  - 这个问题能不能自动化
  - 帮我把问题说清楚
  - 问题说明书
  patterns:
  - 问题\S{0,2}(到底|究竟|本质)(是什么|在哪)
  - (能不能|可以不可以)(自动化|让 AI)
